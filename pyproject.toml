[project]
name = "jaarverantwoording-zorg"
version = "0.1.0"
description = "Retrieval API for Jaarverslagen Zorg: Dutch healthcare annual reports and other public sources, cited to the page"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "mcp>=2.3.0",
    "py7zr>=1.1.4",
    "pymupdf4llm>=2.1",
    "python-multipart>=0.0.22",
    "uvicorn>=0.54.0",
]

[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
# Ruff's defaults, minus idioms used on purpose here: B008 FastAPI's Query()/File() defaults, BLE001 catch-alls that
# report and carry on (live checks, sync loop, workers), PLC3002 the live checks' inline lambdas, SIM115 opener callables.
ignore = ["B008", "BLE001", "PLC3002", "SIM115"]
