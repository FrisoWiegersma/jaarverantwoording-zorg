services:
  api:
    image: jaarverantwoording-zorg-api:${APP_VERSION:-latest}
    build: .
    env_file: .env
    environment:
      DATA_DIR: /app/data
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3210}
      PRESENTON_URL: http://presenton
      PRESENTON_PASSWORD: ${PRESENTON_PASSWORD:?Set a random PRESENTON_PASSWORD in .env}
    volumes:
      - digimv-data:/app/data
    # OCR on a vision model served from the host, such as Ollama (OCR_MODEL=compatible:...).
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
    depends_on:
      presenton:
        condition: service_healthy
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
  web:
    image: jaarverantwoording-zorg-web:${APP_VERSION:-latest}
    build:
      context: ./web
    env_file: .env
    environment:
      DIGIMV_API: http://api:8000
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3210}
    volumes:
      - web-logs:/app/logs
      - web-data:/app/data
    # An OpenAI-compatible server on the host, such as Ollama (OPENAI_COMPATIBLE_BASE_URL).
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "127.0.0.1:3210:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
  presenton:
    image: ghcr.io/presenton/presenton@sha256:dd444e4384df0caeb7cb96a26bfa7543a12d2be19c83d661446b2087d09aed54
    environment:
      LLM: google
      AUTH_USERNAME: integration
      AUTH_PASSWORD: ${PRESENTON_PASSWORD:?Set a random PRESENTON_PASSWORD in .env}
      GOOGLE_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_MODEL: ${PRESENTON_MODEL:-gemini-3.8-flash}
      CAN_CHANGE_KEYS: "false"
      DISABLE_ANONYMOUS_TRACKING: "true"
      DISABLE_IMAGE_GENERATION: "true"
      MEM0_ENABLED: "false"
      PRESENTON_COMMUNITY_ENABLED: "false"
    volumes:
      - presenton-data:/app_data
      # Our own templates, generated by presenton/build_templates.py; Presenton imports them at startup.
      - ./presenton/templates/jaarverslag-licht:/app/templates/jaarverslag-licht:ro
      - ./presenton/templates/jaarverslag-donker:/app/templates/jaarverslag-donker:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1/api/v1/auth/status', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
volumes:
  digimv-data:
  web-logs:
  web-data:
  presenton-data:
