services:
  api:
    image: jaarverantwoording-zorg-api:${APP_VERSION:-latest}
    build: .
    env_file: .env
    environment:
      DATA_DIR: /app/data
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3210}
    volumes:
      - digimv-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
  web:
    image: jaarverantwoording-zorg-web:${APP_VERSION:-latest}
    build:
      context: ./web
    env_file: .env
    environment:
      DIGIMV_API: http://api:8000
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3210}
    volumes:
      - web-logs:/app/logs
    ports:
      - "127.0.0.1:3210:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
volumes:
  digimv-data:
  web-logs:
